name: open-ci tests

on:
  workflow_dispatch:
    inputs:
      plan:
        description: The C-9 test plan, as JSON
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  tests:
    if: github.triggering_actor == 'open-ci-control-plane[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAN: ${{ inputs.plan }}
      GH_TOKEN: ${{ github.token }}
      CONTROL_PLANE: https://ci.joenutt.com
    steps:
      - name: Read the plan
        id: plan
        run: |
          set -euo pipefail
          head_sha="$(jq -er '.headSha' <<<"$PLAN")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "headSha is not a commit SHA" >&2; exit 1; }
          decision_id="$(jq -er '.decisionId' <<<"$PLAN")"
          [[ "$decision_id" =~ ^dec_[0-9a-f]{32}$ ]] || { echo "decisionId is not a decision ID" >&2; exit 1; }
          full_matrix="$(jq -er '.fullMatrix | if type == "boolean" then tostring else error("fullMatrix is not a boolean") end' <<<"$PLAN")"
          shadow="$(jq -er '.shadow | if type == "boolean" then tostring else error("shadow is not a boolean") end' <<<"$PLAN")"
          packages="$(jq -er '(.suites + .alwaysRunSuites) | unique | join(" ")' <<<"$PLAN")"
          for package in $packages; do
            [[ "$package" =~ ^[A-Za-z0-9][A-Za-z0-9._~+/-]*$ ]] || { echo "a suite is not a Go import path" >&2; exit 1; }
          done
          {
            echo "head_sha=$head_sha"
            echo "decision_id=$decision_id"
            echo "full_matrix=$full_matrix"
            echo "shadow=$shadow"
            echo "packages=$packages"
          } >>"$GITHUB_OUTPUT"

      - name: Ignore a plan for a head that is no longer current
        id: current
        env:
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          open_heads=""
          for _ in 1 2 3 4 5 6; do
            if open_heads="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\")] | length")" \
              && [[ "$open_heads" =~ ^[0-9]+$ ]] && [[ "$open_heads" -gt 0 ]]; then
              break
            fi
            sleep 10
          done
          [[ "$open_heads" =~ ^[0-9]+$ ]] || open_heads=0
          if [[ "$open_heads" -gt 0 ]]; then
            echo "is_current=true" >>"$GITHUB_OUTPUT"
          else
            echo "is_current=false" >>"$GITHUB_OUTPUT"
            echo "$HEAD_SHA is not the head of an open pull request; ignoring this plan."
          fi

      - name: Check out the planned head
        if: steps.current.outputs.is_current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.plan.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Go
        if: steps.current.outputs.is_current == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check out this workflow's own actions
        if: steps.current.outputs.is_current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: .open-ci-workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install the tools the suite shells out to
        if: steps.current.outputs.is_current == 'true'
        uses: ./.open-ci-workflow-actions/.github/actions/install-suite-tools

      - name: Run the planned suites
        id: tests
        if: steps.current.outputs.is_current == 'true'
        env:
          FULL_MATRIX: ${{ steps.plan.outputs.full_matrix }}
          PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          set -euo pipefail
          events="$RUNNER_TEMP/test-events.jsonl"
          : >"$events"
          if [[ "$FULL_MATRIX" == "true" ]]; then
            go test -json ./... >"$events"
          elif [[ -n "$PACKAGES" ]]; then
            read -ra planned <<<"$PACKAGES"
            go test -json "${planned[@]}" >"$events"
          fi

      - name: Rerun each failed top-level test once, in shadow
        if: always() && steps.current.outputs.is_current == 'true' && steps.plan.outputs.shadow == 'true'
        run: |
          set -euo pipefail
          events="$RUNNER_TEMP/test-events.jsonl"
          reruns="$RUNNER_TEMP/rerun-events.jsonl"
          : >"$reruns"
          [[ -f "$events" ]] || exit 0
          jq -r 'select(.Action == "fail" and .Test != null and (.Test | contains("/") | not)) | "\(.Package) \(.Test)"' "$events" \
            | sort -u \
            | awk '{names[$1] = (names[$1] == "" ? $2 : names[$1] "|" $2)} END {for (p in names) print p, names[p]}' \
            | while read -r package names; do
                [[ "$package" =~ ^[A-Za-z0-9][A-Za-z0-9._~+/-]*$ && "$names" =~ ^[A-Za-z_][A-Za-z0-9_|]*$ ]] || { echo "a failed test is not a Go identifier" >&2; exit 1; }
                go test -json -count=1 -run "^($names)\$" "$package" >>"$reruns" || true
              done

      - name: Report each top-level test to the control plane
        if: always() && steps.current.outputs.is_current == 'true'
        env:
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
          DECISION_ID: ${{ steps.plan.outputs.decision_id }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          events="$RUNNER_TEMP/test-events.jsonl"
          report="$RUNNER_TEMP/run-report.json"
          [[ -f "$events" ]] || { echo "the suites never ran, so there is nothing to report" >&2; exit 1; }
          reruns="$RUNNER_TEMP/rerun-events.jsonl"
          [[ -f "$reruns" ]] || : >"$reruns"
          jq -sc '[ .[]
            | select(.Test != null and (.Test | contains("/") | not))
            | select(.Action == "pass" or .Action == "fail")
            | {key: (.Package + " " + .Test), value: .Action} ] | from_entries' "$reruns" >"$RUNNER_TEMP/reruns.json"
          jq -sc --arg decision "$DECISION_ID" --slurpfile reruns "$RUNNER_TEMP/reruns.json" '{
            decisionId: $decision,
            tests: [ .[]
              | select(.Test != null and (.Test | contains("/") | not))
              | select(.Action == "pass" or .Action == "fail" or .Action == "skip")
              | {package: .Package, name: .Test, outcome: .Action, seconds: (.Elapsed // 0)}
              | . + (if .outcome == "fail" and $reruns[0][.package + " " + .name] != null
                     then {rerunOutcome: $reruns[0][.package + " " + .name]} else {} end) ]
          }' "$events" >"$report"
          failed="$(jq '[.tests[] | select(.outcome == "fail")] | length' "$report")"
          if [[ "$OUTCOME" != "success" && "$failed" -eq 0 ]]; then
            echo "go test failed without failing a test (a build or package failure); reporting nothing, so open-ci/tests stays pending" >&2
            exit 1
          fi
          token="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE" | jq -er .value)"
          echo "::add-mask::$token"
          answer="$(curl -sS -o /dev/stderr -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary "@$report" \
            "$CONTROL_PLANE/v1/repositories/$GITHUB_REPOSITORY/runs/$HEAD_SHA")"
          echo " <- run report for $HEAD_SHA: $answer"
          [[ "$answer" == 201 ]]
