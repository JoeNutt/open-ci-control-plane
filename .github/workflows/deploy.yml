name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/joenutt/open-ci-control-plane
  CONTROL_PLANE: https://ci.joenutt.com

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=open-ci-control-plane
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Set up the deploy key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy the image of this commit
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          {
            printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN"
            cat docker-compose.prod.yml
          } | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
                -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
                "$VPS_USER@$VPS_HOST" "$tag"

      - name: Check the service answers
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$CONTROL_PLANE/v1/forge/github/events" \
              -H 'X-GitHub-Event: ping' -H 'X-GitHub-Delivery: deploy-check' -H 'X-Hub-Signature-256: sha256=00' -d '{}')"
            if [[ "$code" == 401 ]]; then echo "the service refuses an unsigned delivery: 401"; exit 0; fi
            echo "HTTP $code"; sleep 6
          done
          echo "the service did not answer after the deploy" >&2
          exit 1

  coverage:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    env:
      GCOV2LCOV_VERSION: v1.1.1
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install the tools the suite shells out to
        uses: ./.github/actions/install-suite-tools

      - name: Install gcov2lcov
        run: |
          set -euo pipefail
          go install "github.com/jandelgado/gcov2lcov@$GCOV2LCOV_VERSION"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Upload one suite's per-test coverage per package
        run: |
          set -euo pipefail

          minted_identity_token() {
            curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE" | jq -er .value
          }

          upload_suite() {
            local package="$1" artifact="$2" token answer
            token="$(minted_identity_token)"
            echo "::add-mask::$token"
            answer="$(curl -sS -o /dev/stderr -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $token" \
              -F format=lcov -F "artifact=@$artifact" \
              "$CONTROL_PLANE/v1/repositories/$GITHUB_REPOSITORY/coverage/$package")"
            echo " <- $package: $answer"
            [[ "$answer" == 201 ]]
          }

          artifact="$RUNNER_TEMP/per-test.lcov"
          packages="$(go list ./...)"
          for package in $packages; do
            .github/workflows/per-test-lcov.sh "$package" "$artifact"
            [[ -s "$artifact" ]] || { echo "no coverage for $package"; continue; }
            upload_suite "$package" "$artifact"
          done
