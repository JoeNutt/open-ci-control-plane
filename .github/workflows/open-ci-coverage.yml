name: open-ci coverage

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: open-ci-coverage
  cancel-in-progress: true

jobs:
  coverage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTROL_PLANE: https://ci.joenutt.com
      GCOV2LCOV_VERSION: v1.1.1
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install the tools the suite shells out to
        uses: ./.github/actions/install-suite-tools

      - name: Install gcov2lcov
        run: |
          set -euo pipefail
          go install "github.com/jandelgado/gcov2lcov@$GCOV2LCOV_VERSION"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Upload one suite's per-test coverage per package
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          export GOROOT

          minted_identity_token() {
            curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE" | jq -er .value
          }

          upload_suite() {
            local package="$1" artifact="$2" token answer
            token="$(minted_identity_token)"
            echo "::add-mask::$token"
            answer="$(curl -sS -o /dev/stderr -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $token" \
              -F format=lcov -F "artifact=@$artifact" \
              "$CONTROL_PLANE/v1/repositories/$GITHUB_REPOSITORY/coverage/$package")"
            echo " <- $package: $answer"
            [[ "$answer" == 201 ]]
          }

          artifact="$RUNNER_TEMP/per-test.lcov"
          packages="$(go list ./...)"
          for package in $packages; do
            .github/workflows/per-test-lcov.sh "$package" "$artifact"
            [[ -s "$artifact" ]] || { echo "no coverage for $package"; continue; }
            upload_suite "$package" "$artifact"
          done
